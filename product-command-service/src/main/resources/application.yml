spring:
  application:
    name: updated-product-command-service

  datasource:
    url: jdbc:mysql://localhost:3306/microservice_cqrs
    username: root
    password: manager

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            trusted:
              packages: com.programming.response

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

#http://localhost:8080/swagger-ui.html

server:
  port: 9090